projects:
  - name: GraphRAG Explorer
    subtitle:
      {
        en: ownership in Austrian banking,
        de: Eigentümerstrukturen im österreichischen Bankwesen,
      }
    stack: [Python, Neo4j, FastAPI, React, LLM APIs]
    url: https://github.com/kacperzaleski/graphrag-explorer
    highlights:
      - en: >-
          Built an LLM extraction pipeline that turns 22 Wikipedia articles into
          a knowledge graph of 726 entities and 585 relations, with every fact
          grounded in its source sentence.
        de: >-
          LLM-Extraktionspipeline, die 22 Wikipedia-Artikel in einen Knowledge
          Graph mit 726 Entitäten und 585 Relationen überführt; jeder Fakt ist
          in seinem Quellsatz verankert.
      - en: >-
          Implemented hybrid retrieval (vector + BM25 with rank fusion, graph
          paths, reranker) with cited answers, plus PageRank, community
          detection and a path finder in a React explorer.
        de: >-
          Hybrides Retrieval (Vektor + BM25 mit Rank Fusion, Graphpfade,
          Reranker) mit Quellenangaben, dazu PageRank, Community Detection und
          ein Pfadfinder in einem React-Explorer.
      - en: >-
          Ran a pre-registered, paired evaluation against plain vector RAG with
          a cross-provider LLM judge, bootstrap CIs and McNemar’s test; covered
          by 77 offline pytest tests, Dockerized.
        de: >-
          Präregistrierte, gepaarte Evaluation gegen reines Vektor-RAG mit
          anbieterübergreifendem LLM-Judge, Bootstrap-Konfidenzintervallen und
          McNemar-Test; abgedeckt durch 77 Offline-pytest-Tests, dockerisiert.
  - name: { en: CT-to-PET image synthesis, de: CT-zu-PET-Bildsynthese }
    subtitle: { en: Bachelor’s thesis, de: Bachelorarbeit }
    stack: [PyTorch, diffusion, flow matching]
    url: https://github.com/kacperzaleski/practical-work-CT2PET
    highlights:
      - en: >-
          Compared four generative models (latent diffusion incl. CPDM,
          rectified flow incl. PMRF) and a U-Net baseline on the autoPET dataset
          with one shared evaluation.
        de: >-
          Vergleich von vier generativen Modellen (Latent Diffusion inkl. CPDM,
          Rectified Flow inkl. PMRF) und einer U-Net-Baseline auf dem
          autoPET-Datensatz mit einheitlicher Evaluation.
      - en: >-
          PMRF reached the best realism (FID 42.0, KID 0.008, 4.6× lower KID
          than the U-Net) while keeping the best SSIM of all generators.
        de: >-
          PMRF erreichte den höchsten Realismus (FID 42,0, KID 0,008, 4,6×
          niedrigere KID als das U-Net) bei der besten SSIM aller Generatoren.

